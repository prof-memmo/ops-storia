name: Deploy Ecosistema Prof. Memmo

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout Main (Production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main_src

      - name: Checkout Preview (Anteprima)
        uses: actions/checkout@v4
        with:
          ref: preview
          path: _preview_src

      - name: Build Main (Production)
        run: |
          cd _main_src
          npm ci
          npm run build

      - name: Build Preview (Anteprima)
        run: |
          cd _preview_src
          npm ci
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Unified Site (Live on root / and Preview on /preview/)
        run: |
          mkdir -p _site/preview
          rsync -av _main_src/out/ _site/
          rsync -av _preview_src/out/ _site/preview/
          rm -rf _main_src _preview_src

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
